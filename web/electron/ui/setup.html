<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thiết lập database</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#080d13;color:#edf3f7;font-family:"Segoe UI",Arial,sans-serif}.page{max-width:680px;margin:auto;padding:32px}.eyebrow{margin:0 0 5px;color:#58c5ca;font-size:10px;font-weight:700;letter-spacing:1.3px}h1{margin:0 0 8px;font-size:23px}p{color:#8e9daa;font-size:13px}.form{margin-top:24px;padding:22px;border:1px solid #293743;background:#0f171f}.grid{display:grid;grid-template-columns:1fr 140px;gap:14px}.full{grid-column:1/-1}label span{display:block;margin-bottom:6px;color:#94a4ae;font-size:10px;font-weight:600;text-transform:uppercase}input{width:100%;height:40px;border:1px solid #354652;background:#121d25;color:#fff;padding:0 11px;outline:none}input:focus{border-color:#58c5ca}.actions{display:flex;gap:8px;margin-top:20px}button{height:42px;border:1px solid #3e5963;background:#16323a;color:#ddf5f6;padding:0 16px;font-weight:700;font-size:11px;cursor:pointer}button.primary{margin-left:auto;background:#58c5ca;color:#071013;border-color:#58c5ca}button:disabled{opacity:.45;cursor:wait}.result{display:none;margin-top:15px;padding:12px;border:1px solid #2b5947;background:#10241d;color:#71d6a2;font-size:12px}.result.error{border-color:#63343a;background:#29171b;color:#f1848c}.note{margin-top:15px;padding:11px;border-left:3px solid #435865;background:#141e26;color:#9aabb5;font-size:11px}
  </style>
</head>
<body><main class="page"><p class="eyebrow">CẤU HÌNH LẦN ĐẦU</p><h1>THIẾT LẬP DATABASE</h1><p>Kết nối MySQL 8 và bảo vệ API nhận dữ liệu từ LoRa Gateway.</p><form id="setupForm" class="form"><div class="grid"><label><span>MySQL Host</span><input id="dbHost" value="localhost" required></label><label><span>Port</span><input id="dbPort" type="number" value="3306" min="1" max="65535" required></label><label class="full"><span>Database</span><input id="dbName" value="gps_rescue" required></label><label><span>Username</span><input id="dbUser" value="root" required></label><label><span>Password</span><input id="dbPassword" type="password"></label><label><span>Gateway API Key</span><input id="gatewayApiKey" type="password" value="change_me" required></label><label><span>API Port</span><input id="apiPort" type="number" value="3000" min="1" max="65535" required></label></div><div id="result" class="result"></div><div class="note">Cấu hình được lưu trong thư mục dữ liệu người dùng Windows và không được đóng gói vào mã nguồn.</div><div class="actions"><button id="testButton" type="button">KIỂM TRA KẾT NỐI</button><button id="saveButton" class="primary" type="submit">LƯU CẤU HÌNH</button></div></form></main>
<script>
const ids=['dbHost','dbPort','dbName','dbUser','dbPassword','gatewayApiKey','apiPort'];const values=()=>Object.fromEntries(ids.map(id=>[id,document.getElementById(id).value]));const result=document.getElementById('result');const show=(text,error=false)=>{result.textContent=text;result.className=`result ${error?'error':''}`;result.style.display='block';};document.getElementById('testButton').addEventListener('click',async(event)=>{event.target.disabled=true;show('Đang kiểm tra...');const response=await window.electronAPI.testDatabase(values());show(response.message,!response.success);event.target.disabled=false;});document.getElementById('setupForm').addEventListener('submit',async(event)=>{event.preventDefault();const button=document.getElementById('saveButton');button.disabled=true;try{await window.electronAPI.saveConfig(values());show('Đã lưu cấu hình. Đang khởi động hệ thống...');await window.electronAPI.finishSetup();}catch(error){show(error.message,true);button.disabled=false;}});
</script></body>
</html>
