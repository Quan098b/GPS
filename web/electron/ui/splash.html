<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Khởi động LoRa GPS Rescue</title>
  <style>
    *{box-sizing:border-box}body{margin:0;height:100vh;display:grid;place-items:center;background:#0b1118;color:#eef4f7;font-family:"Segoe UI",Arial,sans-serif;border:1px solid #344552}.wrap{width:100%;padding:42px;text-align:center}.mark{width:58px;height:58px;margin:0 auto 24px;display:grid;place-items:center;border:1px solid #42616d;background:#13242d;color:#58c5ca;font-size:25px}.signal{width:18px;height:18px;border:3px solid currentColor;border-radius:50%;position:relative}.signal:before,.signal:after{content:"";position:absolute;border:2px solid currentColor;border-radius:50%;inset:-9px;opacity:.6}.signal:after{inset:-16px;opacity:.25}h1{margin:0;font-size:17px;letter-spacing:0;font-weight:700}.sub{margin:7px 0 30px;color:#80929d;font-size:11px;letter-spacing:1px}.loader{height:3px;background:#1e2b34;overflow:hidden}.loader span{display:block;height:100%;width:38%;background:#58c5ca;animation:move 1.2s infinite ease-in-out}.status{margin-top:15px;color:#aebdc6;font-size:12px}.steps{margin-top:22px;display:flex;justify-content:center;gap:9px}.step{width:6px;height:6px;border-radius:50%;background:#2f3e48}.step.done{background:#58c5ca;box-shadow:0 0 7px #58c5ca}@keyframes move{0%{transform:translateX(-110%)}100%{transform:translateX(365%)}}
  </style>
</head>
<body><div class="wrap"><div class="mark"><span class="signal"></span></div><h1>HỆ THỐNG ĐỊNH VỊ & CỨU HỘ LORA</h1><p class="sub">TRUNG TÂM ĐIỀU PHỐI</p><div class="loader"><span></span></div><div id="status" class="status">Đang khởi động hệ thống...</div><div class="steps"><i class="step"></i><i class="step"></i><i class="step"></i><i class="step"></i></div></div>
<script>window.electronAPI.onSplashStatus((data)=>{document.getElementById('status').textContent=data.text;document.querySelectorAll('.step').forEach((step,index)=>step.classList.toggle('done',index<data.step));});</script></body>
</html>
